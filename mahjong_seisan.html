<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>精算麻雀</title>
<style>
:root {
  --bg:#1a1a2e; --panel:#16213e; --panel2:#0f3460;
  --gold:#f5a623; --text:#eaeaea; --muted:#8892a4;
  --green:#4caf8a; --active:#00bfff; --active-bg:#003855;
  --btn:#1e3a5f; --border:#2a3a5a;
  --plus:#4caaff; --minus:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{
  background:var(--bg);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;overflow:hidden;}

#app{
  display:flex;flex-direction:column;
  height:100dvh;width:100dvw;
  padding:6px 8px 6px 8px;gap:4px;overflow:hidden;
}

/* ===== 上段：表 ===== */
#table-wrap{
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;flex-shrink:0;
}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th,td{border:1px solid var(--border);padding:3px 4px;text-align:right;white-space:nowrap;overflow:hidden;}
/* P・チップ行はpaddingをリセット */
tr.tr-p > td, tr.tr-chip > td { padding: 0 !important; }
.col-ac {width:28px;}
.col-pl {width:13%;}
.col-bd {width:40px;}
.col-df {width:38px;}
th{background:var(--panel2);color:var(--gold);font-size:11px;text-align:center;font-weight:700;}
th.c-green{background:rgba(76,175,138,.25);color:var(--green);}
td.c-green{background:rgba(76,175,138,.12);color:var(--green);}
td:first-child{text-align:center;color:var(--muted);font-size:11px;}
td.sc{cursor:pointer;transition:background .12s;}
td.sc:hover{background:rgba(0,191,255,.07);}
td.sc.active{background:var(--active-bg)!important;outline:2px solid var(--active);outline-offset:-2px;}
/* P・チップ行：正方形（幅13%≒スマホ横向きで約55-60px → 高さも同程度） */
tbody tr.tr-p   td,
tfoot tr.tr-chip td,
tr.tr-p   td,
tr.tr-chip td{ height:52px !important; min-height:52px !important; padding:0 !important; text-align:center; vertical-align:middle; font-size:13px; font-weight:700; }
tbody tr.tr-p   td,
tr.tr-p   td{ background:#1a2a1a; border:1.5px solid #2a4a2a; }
tfoot tr.tr-chip td,
tr.tr-chip td{ background:#1a3a4a; color:#7dd3ea; border:1.5px solid #1a4a5a; }
tr.tr-total td{background:var(--panel2);font-weight:700;color:var(--gold);border-top:2px solid var(--gold);}
td.bd-auto{opacity:.5;}
.pos{color:#7dd3ea;} .neg{color:#ff8a80;} .zero{color:var(--muted);}
button.name-btn{
  background:none;border:none;color:var(--gold);
  font-weight:700;font-size:11px;cursor:pointer;
  padding:0;width:100%;text-align:center;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
button.ac-btn{
  background:#3a1a1a;border:1px solid #5a2a2a;border-radius:4px;
  color:#ff8a80;font-size:10px;font-weight:900;
  cursor:pointer;width:100%;height:100%;padding:2px 3px;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

/* ===== 中段：テンキー ===== */
#numpad-wrap{
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:4px;flex-shrink:0;
}
#np-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}
.nb{
  background:var(--btn);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-size:18px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:12px 0;
  user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .1s,transform .08s;
}
.nb:active{background:#2a5080;transform:scale(.93);}
.nb-neg{background:#1a2a3a;color:#7dd3ea;border-color:#2a4a6a;font-size:14px;}
.nb-clr{background:#2a1a3a;color:#c084fc;border-color:#4a2a5a;font-size:15px;font-weight:900;}
.nb-dot{font-size:20px;font-weight:900;color:#aad4ff;}

/* ===== 下段：左=支出 右=設定 ===== */
#bottom-row{display:flex;flex-direction:row;gap:6px;flex:1;min-height:0;overflow:hidden;}

/* 左：A〜E支出 */
#payout-block{
  display:flex;flex-direction:column;gap:3px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;
  flex:1;min-width:0;overflow:hidden;
}
.payout-row{
  display:flex;align-items:center;gap:6px;
  flex:1;
}
.payout-name{
  font-size:12px;font-weight:700;color:var(--gold);
  min-width:34px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.payout-val{
  flex:1;background:var(--btn);border:1.5px solid var(--border);
  border-radius:6px;padding:3px 8px;
  font-size:14px;font-weight:900;text-align:right;
  cursor:pointer;transition:border-color .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.payout-val.active{border-color:var(--active);background:var(--active-bg);box-shadow:0 0 0 2px rgba(0,191,255,.22);}
.payout-unit{font-size:11px;color:var(--muted);}

/* 右：設定 */
#settings-block{
  display:flex;flex-direction:column;gap:4px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;
  min-width:160px;
}
.s-row{display:flex;align-items:center;gap:4px;font-size:11px;}
.s-label{color:var(--muted);white-space:nowrap;min-width:64px;}
.s-val{
  background:var(--btn);border:1.5px solid var(--border);
  border-radius:4px;padding:2px 5px;
  font-size:12px;font-weight:700;color:var(--text);
  min-width:60px;text-align:right;
  cursor:pointer;transition:border-color .15s,background .15s;
}
.s-val.active{border-color:var(--active);background:var(--active-bg);box-shadow:0 0 0 2px rgba(0,191,255,.22);}
.s-val.ro{color:var(--gold);cursor:default;border-color:rgba(245,166,35,.3);}
.s-unit{color:var(--muted);font-size:10px;}

/* ABCDEボタン行 */
#player-btns{display:flex;gap:3px;margin-top:2px;}
.pl-btn{
  flex:1;background:var(--panel2);border:1.5px solid var(--border);
  border-radius:6px;color:var(--gold);font-size:12px;font-weight:700;
  padding:5px 2px;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s,border-color .1s;
}
.pl-btn:active{background:#1a4080;}
.pl-btn.active-pl{border-color:var(--active);background:var(--active-bg);color:var(--active);}

/* ===== 名前ダイアログ ===== */
#name-dialog{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:100;
}
#name-dialog.open{display:flex;}
#name-box{
  background:var(--panel2);border:2px solid var(--active);
  border-radius:12px;padding:14px;
  display:flex;flex-direction:column;gap:8px;min-width:220px;max-height:90dvh;overflow-y:auto;
}
#name-title{color:var(--active);font-size:13px;font-weight:700;text-align:center;}
#name-preview{
  background:var(--btn);border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;
  text-align:center;font-size:20px;font-weight:900;color:var(--text);min-height:34px;
}
#name-keyboard{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.nk-btn{
  background:var(--btn);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-size:12px;padding:5px 2px;
  cursor:pointer;text-align:center;font-family:inherit;
  -webkit-tap-highlight-color:transparent;transition:background .1s;
}
.nk-btn:active{background:#2a5080;}
.nk-del{background:#3a1a1a;color:#ff8a80;border-color:#5a2a2a;grid-column:span 2;}
.nk-ok{background:#0a3a6a;color:#00bfff;border-color:#00bfff;font-weight:900;grid-column:span 3;}
.nk-ok:active{background:#1a5a8a;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div id="app">

  <!-- 上段：表 -->
  <div id="table-wrap">
    <table>
      <colgroup>
        <col class="col-ac">
        <col class="col-pl"><col class="col-pl"><col class="col-pl">
        <col class="col-pl"><col class="col-pl">
        <col class="col-bd"><col class="col-df">
      </colgroup>
      <thead>
        <tr id="header-row">
          <th style="padding:0"><button class="ac-btn" onclick="confirmClear()">AC</button></th>
          <!-- 名前ヘッダーはJS生成 -->
          <th class="c-green">場代</th>
          <th style="color:var(--muted);font-size:10px;">差異</th>
        </tr>
      </thead>
      <tbody id="s-body"></tbody>
      <tfoot id="s-foot"></tfoot>
    </table>
  </div>

  <!-- 中段：テンキー -->
  <div id="numpad-wrap">
    <div id="np-grid">
      <button class="nb" data-v="1">1</button>
      <button class="nb" data-v="2">2</button>
      <button class="nb" data-v="3">3</button>
      <button class="nb" data-v="4">4</button>
      <button class="nb" data-v="5">5</button>
      <button class="nb" data-v="6">6</button>
      <button class="nb" data-v="7">7</button>
      <button class="nb" data-v="8">8</button>
      <button class="nb" data-v="9">9</button>
      <button class="nb nb-neg" data-v="neg">▲</button>
      <button class="nb" data-v="0">0</button>
      <button class="nb nb-dot" data-v=".">・</button>
      <button class="nb nb-clr" data-v="clr">C</button>
    </div>
  </div>

  <!-- 下段 -->
  <div id="bottom-row">

    <!-- 左：A〜E支出 -->
    <div id="payout-block">
      <!-- JS生成 -->
    </div>

    <!-- 右：設定 -->
    <div id="settings-block">
      <div class="s-row">
        <span class="s-label">レート 1P＝</span>
        <span class="s-val" id="sv-rate">100</span>
        <span class="s-unit">円</span>
      </div>
      <div class="s-row">
        <span class="s-label">チップ 1P＝</span>
        <span class="s-val" id="sv-cr">500</span>
        <span class="s-unit">円</span>
      </div>
      <div class="s-row">
        <span class="s-label">場代積立</span>
        <span class="s-val ro" id="sv-tsumi">0</span>
        <span class="s-unit">円</span>
      </div>
      <div class="s-row">
        <span class="s-label">場代請求</span>
        <span class="s-val" id="sv-pay">0</span>
        <span class="s-unit">円</span>
      </div>
      <!-- ABCDEボタン -->
      <div id="player-btns"></div>
    </div>

  </div>
</div>

<!-- 名前ダイアログ -->
<div id="name-dialog">
  <div id="name-box">
    <div id="name-title">名前を入力（3文字まで）</div>
    <div id="name-preview"></div>
    <div id="name-keyboard"></div>
  </div>
</div>

<script>
// ===== CONST =====
const ROWS=12, PL=['A','B','C','D','E'];
const SAVE_KEY='seisan_mahjong_v2';
const DEFAULT_NAMES={A:'ちやば',B:'B',C:'C',D:'D',E:'E'};
const NAME_KEYS=[
  'あ','い','う','え','お','か','き','く','け','こ',
  'さ','し','す','せ','そ','た','ち','つ','て','と',
  'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
  'ま','み','む','め','も','や','ゆ','よ','ら','り',
  'る','れ','ろ','わ','を','ん','ー','\u309b','A','B',
  'C','D','E','1','2','3','4','5','6','7','8','9','0'
];

// ===== STATE =====
const st={
  sc:{}, chips:{A:0,B:0,C:0,D:0,E:0}, bd:{}, bdManual:{},
  names:{...DEFAULT_NAMES},
  rate:100, cr:500, pay:0, payManual:false,
  act:null, buf:'',
  selPlayers:new Set(['A','B','C','D']),  // 場代割り勘対象（複数選択）
  editingName:null, nameBuf:''
};
for(let r=1;r<=ROWS;r++){
  st.sc[r]={A:null,B:null,C:null,D:null,E:null};
  st.bd[r]=null; st.bdManual[r]=false;
}

// ===== HELPERS =====
function fmt(v){
  if(v===null||v===undefined)return '';
  const n=Number(v);if(isNaN(n))return '';
  return n<0?'▲'+Math.abs(n):String(n);
}
function cls(v){
  if(v===null||v===undefined)return '';
  const n=Number(v);return n>0?'pos':n<0?'neg':'zero';
}
function sumP(p){let s=0;for(let r=1;r<=ROWS;r++){const v=st.sc[r][p];if(v!==null)s+=v;}return s;}
function sumBd(){let s=0;for(let r=1;r<=ROWS;r++){const v=st.bd[r];if(v!==null)s+=v;}return s;}
function rowHasScore(r){return PL.some(p=>st.sc[r][p]!==null);}
function rowDiff(r){
  const vs=PL.map(p=>st.sc[r][p]).filter(v=>v!==null);
  if(!vs.length)return null;
  return vs.reduce((a,b)=>a+b,0)+(st.bd[r]??0);
}
function effectivePay(){return st.payManual?st.pay:sumBd()*st.rate;}

// 場代負担 = (場代請求 - 場代積立) ÷ 選択人数、選択プレイヤーのみ負担
function calcFutan(p){
  const nin=st.selPlayers.size||1;
  const diff=effectivePay()-sumBd()*st.rate;
  if(!st.selPlayers.has(p))return 0;
  const raw=diff/nin;
  return Math.ceil(raw/100)*100; // 100円未満切り上げ
}
function calcPayout(p){
  return sumP(p)*st.rate + st.chips[p]*st.cr - calcFutan(p);
}

function autoFillBd(){
  const base=st.bd[1];
  for(let r=2;r<=ROWS;r++){
    if(st.bdManual[r])continue;
    st.bd[r]=rowHasScore(r)?base:null;
  }
}

function isAct(t){
  const a=st.act;if(!a||a.type!==t.type)return false;
  if(t.type==='sc')  return a.row===t.row&&a.p===t.p;
  if(t.type==='chip')return a.p===t.p;
  if(t.type==='bd')  return a.row===t.row;
  if(t.type==='prm') return a.k===t.k;
  return false;
}

// ===== COMMIT =====
function commitCurrent(){
  const t=st.act;if(!t)return;
  const val=(st.buf===''||st.buf==='-')?null:parseInt(st.buf,10);
  const n=val??0;
  if(t.type==='sc'){st.sc[t.row][t.p]=val;autoFillBd();}
  else if(t.type==='chip')st.chips[t.p]=n;
  else if(t.type==='bd'){st.bd[t.row]=val;st.bdManual[t.row]=(val!==null);autoFillBd();}
  else if(t.type==='prm'){
    if(t.k==='rate')st.rate=n||1;
    else if(t.k==='cr')st.cr=n||1;
    else if(t.k==='pay'){st.pay=n;st.payManual=true;}
  }
}

// ===== ACTIVATE =====
function activate(t){
  if(isAct(t))return;
  commitCurrent();
  st.act=t;st.buf='';
  render();
}

// ===== RENDER =====
function render(){
  renderHeader();renderBody();renderFoot();renderPayout();renderSettings();
  saveState();
}

function renderHeader(){
  const hr=document.getElementById('header-row');
  while(hr.children.length>3)hr.removeChild(hr.children[1]);
  const ref=hr.children[1];
  PL.forEach(p=>{
    const th=document.createElement('th');
    const btn=document.createElement('button');
    btn.className='name-btn';btn.textContent=st.names[p];
    btn.addEventListener('click',()=>openNameDialog(p));
    th.appendChild(btn);hr.insertBefore(th,ref);
  });
}

function renderBody(){
  const tb=document.getElementById('s-body');tb.innerHTML='';
  // 1行のみ（P行として使用）
  const r=1;
  const tr=document.createElement('tr');
  tr.className='tr-p';
  const tn=document.createElement('td');tn.textContent='P';tn.style.fontWeight='700';tn.style.color='var(--gold)';tr.appendChild(tn);
  PL.forEach(p=>{
    const td=document.createElement('td');td.className='sc';
    const v=st.sc[r][p];
    td.textContent=fmt(v);if(v!==null)td.classList.add(cls(v));
    if(isAct({type:'sc',row:r,p}))td.classList.add('active');
    td.addEventListener('click',()=>activate({type:'sc',row:r,p}));
    tr.appendChild(td);
  });
  // 場代
  const tbd=document.createElement('td');tbd.className='sc c-green';
  const bdv=st.bd[r];
  if(isAct({type:'bd',row:r})){
    const b=st.buf;
    tbd.textContent=(b===''||b==='-')?'':(n=>isNaN(n)?'':fmt(n))(parseInt(b,10));
    tbd.classList.add('active');
  }else{
    tbd.textContent=bdv!==null?fmt(bdv):'';
  }
  tbd.addEventListener('click',()=>activate({type:'bd',row:r}));
  tr.appendChild(tbd);
  // 差異
  const tdif=document.createElement('td');
  const d=rowDiff(r);
  if(d!==null&&d!==0){tdif.textContent=fmt(d);tdif.classList.add(cls(d));}
  tr.appendChild(tdif);
  tb.appendChild(tr);
}

function renderFoot(){
  const tf=document.getElementById('s-foot');tf.innerHTML='';
  // チップ行のみ（計行は削除）
  const tr2=document.createElement('tr');tr2.className='tr-chip';
  const tc=document.createElement('td');tc.textContent='チップ';tc.style.textAlign='center';tc.style.fontSize='10px';tr2.appendChild(tc);
  PL.forEach(p=>{
    const td=document.createElement('td');td.className='sc';
    const v=st.chips[p];
    td.textContent=v?fmt(v):'';if(v)td.classList.add(cls(v));
    if(isAct({type:'chip',p}))td.classList.add('active');
    td.addEventListener('click',()=>activate({type:'chip',p}));
    tr2.appendChild(td);
  });
  tr2.appendChild(document.createElement('td'));
  const chipSum=PL.reduce((s,p)=>s+st.chips[p],0);
  const tdcd=document.createElement('td');
  if(chipSum){tdcd.textContent=fmt(chipSum);tdcd.classList.add(cls(chipSum));}
  tr2.appendChild(tdcd);tf.appendChild(tr2);
}

function renderPayout(){
  const bl=document.getElementById('payout-block');bl.innerHTML='';
  PL.forEach(p=>{
    const v=calcPayout(p);
    const row=document.createElement('div');row.className='payout-row';
    const nm=document.createElement('span');
    nm.className='payout-name';nm.textContent=st.names[p];
    nm.addEventListener('click',()=>openNameDialog(p));
    row.appendChild(nm);
    const vEl=document.createElement('span');
    vEl.className='payout-val';
    vEl.textContent=fmt_payout(v);vEl.classList.add(cls(v));
    row.appendChild(vEl);
    const u=document.createElement('span');u.className='payout-unit';u.textContent='円';
    row.appendChild(u);
    bl.appendChild(row);
  });
}

function fmt_payout(v){
  if(v===0)return '0';
  if(v<0)return '▲'+Math.abs(Math.round(v)).toLocaleString();
  return '+'+Math.round(v).toLocaleString();
}

function renderSettings(){
  document.getElementById('sv-rate').textContent=st.rate.toLocaleString();
  document.getElementById('sv-cr').textContent=st.cr.toLocaleString();
  document.getElementById('sv-tsumi').textContent=(sumBd()*st.rate).toLocaleString();
  document.getElementById('sv-pay').textContent=effectivePay().toLocaleString();

  ['rate','cr','pay'].forEach(k=>{
    document.getElementById('sv-'+k)?.classList.toggle('active',isAct({type:'prm',k}));
  });

  // ABCDEボタン（複数選択）
  const pb=document.getElementById('player-btns');pb.innerHTML='';
  PL.forEach(p=>{
    const b=document.createElement('button');
    b.className='pl-btn'+(st.selPlayers.has(p)?' active-pl':'');
    b.textContent=st.names[p];
    b.addEventListener('click',()=>{
      if(st.selPlayers.has(p)){
        if(st.selPlayers.size>1)st.selPlayers.delete(p); // 最低1人は残す
      }else{
        st.selPlayers.add(p);
      }
      render();
    });
    pb.appendChild(b);
  });
}

function updateLabel(){
  const el=document.getElementById('np-label');const t=st.act;
  if(!t){el.textContent='—';return;}
  if(t.type==='sc')  el.textContent=`${t.row}局 ${st.names[t.p]}`;
  else if(t.type==='chip')el.textContent=`チップ ${st.names[t.p]}`;
  else if(t.type==='bd') el.textContent=`場代 ${t.row}局`;
  else if(t.type==='prm'){
    const m={rate:'レート1P',cr:'チップ1P',pay:'場代請求'};
    el.textContent=m[t.k]||t.k;
  }
}
function updateDisp(){
  const el=document.getElementById('np-disp');const b=st.buf;
  if(!b){el.textContent='—';return;}
  if(b==='-'){el.textContent='▲';return;}
  // 小数点入力中はそのまま表示
  if(b.endsWith('.')){el.textContent=b;return;}
  const n=parseFloat(b);
  el.textContent=isNaN(n)?'—':n<0?'▲'+Math.abs(n):String(n);
}

// ===== NUMPAD =====
document.getElementById('np-grid').addEventListener('click',e=>{
  const btn=e.target.closest('.nb');if(!btn)return;
  const v=btn.dataset.v;const b=st.buf;
  if(v==='clr'){    st.buf='';
    const t=st.act;
    if(t){
      if(t.type==='sc'){st.sc[t.row][t.p]=null;autoFillBd();}
      else if(t.type==='chip')st.chips[t.p]=0;
      else if(t.type==='bd'){st.bd[t.row]=null;st.bdManual[t.row]=false;autoFillBd();}
      else if(t.type==='prm'){
        if(t.k==='rate')st.rate=100;
        else if(t.k==='cr')st.cr=500;
        else if(t.k==='pay'){st.pay=0;st.payManual=false;}
      }
    }
    render();return;
  }
  if(v==='neg'){
    if(!st.act)return;
    st.buf=b.startsWith('-')?b.slice(1):'-'+b;
    updateDisp();render();return;
  }
  if(v==='.'){
    if(!st.act)return;
    if(!b.includes('.'))st.buf=(b===''||b==='-'?b+'0':b)+'.';
    updateDisp();return;
  }
  if(!st.act)return;
  if(b===''||b==='0')       st.buf=v;
  else if(b==='-'||b==='-0')st.buf='-'+v;
  else                       st.buf=b+v;
  // 即時反映
  const t=st.act;const cur=st.buf;
  const parsed=cur.endsWith('.')?parseFloat(cur.slice(0,-1)):parseFloat(cur);
  const val=(cur===''||cur==='-'||isNaN(parsed))?null:parsed;
  const n=val??0;
  if(t.type==='sc'){st.sc[t.row][t.p]=val;autoFillBd();}
  else if(t.type==='chip')st.chips[t.p]=n;
  else if(t.type==='bd'){st.bd[t.row]=val;if(val!==null)st.bdManual[t.row]=true;autoFillBd();}
  else if(t.type==='prm'){
    if(t.k==='rate')st.rate=n||1;
    else if(t.k==='cr')st.cr=n||1;
    else if(t.k==='pay'){st.pay=n;st.payManual=true;}
  }
  render();
});

// ===== SETTINGS CLICK =====
[['sv-rate','rate'],['sv-cr','cr'],['sv-pay','pay']].forEach(([id,k])=>{
  document.getElementById(id)?.addEventListener('click',()=>activate({type:'prm',k}));
});

// ===== AC =====
const DEFAULT_STATE=()=>({
  sc:Object.fromEntries(Array.from({length:ROWS},(_,i)=>[i+1,{A:null,B:null,C:null,D:null,E:null}])),
  chips:{A:0,B:0,C:0,D:0,E:0},
  bd:Object.fromEntries(Array.from({length:ROWS},(_,i)=>[i+1,null])),
  bdManual:Object.fromEntries(Array.from({length:ROWS},(_,i)=>[i+1,false])),
});
function confirmClear(){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;';
  overlay.innerHTML=`<div style="background:#16213e;border:2px solid #e94560;border-radius:12px;padding:20px 24px;text-align:center;min-width:220px;">
    <div style="color:#eaeaea;font-size:14px;font-weight:700;margin-bottom:16px;">入力データを消去しますか？</div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button id="ac-yes" style="background:#3a1a1a;border:1.5px solid #e94560;border-radius:8px;color:#ff8a80;font-size:14px;font-weight:900;padding:8px 24px;cursor:pointer;font-family:inherit;">YES</button>
      <button id="ac-no"  style="background:#1e3a5f;border:1.5px solid #2a3a5a;border-radius:8px;color:#eaeaea;font-size:14px;font-weight:700;padding:8px 24px;cursor:pointer;font-family:inherit;">NO</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#ac-yes').addEventListener('click',()=>{
    const ds=DEFAULT_STATE();
    Object.assign(st,ds);
    st.rate=100;st.cr=500;st.pay=0;st.payManual=false;
    st.act=null;st.buf='';st.selPlayers=new Set(['A','B','C','D']);
    Object.assign(st.names,DEFAULT_NAMES);
    localStorage.removeItem(SAVE_KEY);
    document.body.removeChild(overlay);render();
  });
  overlay.querySelector('#ac-no').addEventListener('click',()=>document.body.removeChild(overlay));
}

// ===== 名前ダイアログ =====
function openNameDialog(p){
  commitCurrent();st.act=null;st.buf='';
  st.editingName=p;
  st.nameBuf=Object.values(DEFAULT_NAMES).includes(st.names[p])&&st.names[p].length===1?'':st.names[p];
  buildNameKeyboard();updateNamePreview();
  document.getElementById('name-dialog').classList.add('open');
  render();
}
function buildNameKeyboard(){
  const oldKb=document.getElementById('name-keyboard');
  const newKb=oldKb.cloneNode(false);
  oldKb.parentNode.replaceChild(newKb,oldKb);
  const DAKUTEN={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
  NAME_KEYS.forEach(k=>{
    const b=document.createElement('button');b.className='nk-btn';b.textContent=k;b.dataset.key=k;newKb.appendChild(b);
  });
  const del=document.createElement('button');del.className='nk-btn nk-del';del.textContent='⌫ 削除';del.dataset.key='DEL';newKb.appendChild(del);
  const ok=document.createElement('button');ok.className='nk-btn nk-ok';ok.textContent='OK';ok.dataset.key='OK';newKb.appendChild(ok);
  newKb.addEventListener('click',e=>{
    const btn=e.target.closest('[data-key]');if(!btn)return;
    const k=btn.dataset.key;
    if(k==='OK'){st.names[st.editingName]=st.nameBuf.trim()||st.editingName;closeNameDialog();return;}
    if(k==='DEL'){st.nameBuf=st.nameBuf.slice(0,-1);updateNamePreview();return;}
    if(k==='\u309b'&&st.nameBuf.length>0){
      const last=st.nameBuf.slice(-1);
      if(DAKUTEN[last]){st.nameBuf=st.nameBuf.slice(0,-1)+DAKUTEN[last];updateNamePreview();return;}
    }
    if(st.nameBuf.length>=3)return;
    st.nameBuf+=k;updateNamePreview();
  });
}
function updateNamePreview(){document.getElementById('name-preview').textContent=st.nameBuf||'　';}
function closeNameDialog(){
  st.editingName=null;
  document.getElementById('name-dialog').classList.remove('open');
  render();
}
document.getElementById('name-dialog').addEventListener('click',e=>{
  if(e.target===document.getElementById('name-dialog'))closeNameDialog();
});

// ===== LOCALSTORAGE =====
function saveState(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({
    sc:st.sc,chips:st.chips,bd:st.bd,bdManual:st.bdManual,
    names:st.names,rate:st.rate,cr:st.cr,pay:st.pay,payManual:st.payManual,
    selPlayers:[...st.selPlayers]
  }));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;
    const d=JSON.parse(raw);
    for(let r=1;r<=ROWS;r++){
      if(d.sc?.[r])st.sc[r]=d.sc[r];
      if(d.bd?.[r]!==undefined)st.bd[r]=d.bd[r];
      if(d.bdManual?.[r]!==undefined)st.bdManual[r]=d.bdManual[r];
    }
    if(d.chips)Object.assign(st.chips,d.chips);
    if(d.names)Object.assign(st.names,d.names);
    if(d.rate!==undefined)st.rate=d.rate;
    if(d.cr!==undefined)st.cr=d.cr;
    if(d.pay!==undefined)st.pay=d.pay;
    if(d.payManual!==undefined)st.payManual=d.payManual;
    if(d.selPlayers)st.selPlayers=new Set(d.selPlayers);
  }catch(e){}
}

// ===== INIT =====
loadState();
render();
</script>
